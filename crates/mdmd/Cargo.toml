[package]
name = "mdmd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent Apple MDM engine, server, and management CLI"

[dependencies]
mdm-core = { path = "../mdm-core" }
mdm-protocol = { path = "../mdm-protocol" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
openssl = "0.10"
openssl-sys = "0.9"
foreign-types = "0.3"
percent-encoding = "2"
plist = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["native-tls-alpn", "http2", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-openssl = "0.6"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
