# Example TLS and client-certificate boundary for the MDM API.
# Replace paths and the upstream address for the deployment.
# Include this fragment inside nginx's http {} block. Empty keys leave the
# device command/check-in routes outside these bootstrap/operator rate limits.
map $uri $mdm_scep_limit_key {
    default "";
    /scep $binary_remote_addr;
}
map $uri $mdm_admin_limit_key {
    default "";
    ~^/v1/ $binary_remote_addr;
}
limit_req_zone $mdm_scep_limit_key zone=mdm_scep:10m rate=5r/s;
limit_req_zone $mdm_admin_limit_key zone=mdm_admin:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name mdm.example.invalid;

    client_max_body_size 2m;
    large_client_header_buffers 4 32k;
    limit_req zone=mdm_scep burst=10 nodelay;
    limit_req zone=mdm_admin burst=20 nodelay;
    limit_req_status 429;

    ssl_certificate     /etc/mdm/tls/server.crt;
    ssl_certificate_key /etc/mdm/tls/server.key;

    # This is the SCEP CA that signs issued client certificates.
    ssl_client_certificate /etc/mdm/ca.pem;
    # Bootstrap SCEP and authenticated admin routes do not carry a device
    # certificate. Device endpoints enforce SUCCESS in the backend.
    ssl_verify_client optional;
    ssl_verify_depth 2;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-MDM-Client-Verify $ssl_client_verify;
        # Nginx percent-escapes the complete PEM for a single HTTP header.
        proxy_set_header X-MDM-Client-Cert $ssl_client_escaped_cert;
    }
}
